name: Radar y avisos Telegram

on:
  schedule:
    # De 7:07 a 23:07 hora de España en invierno, cada 30 min (en verano, +1 h porque cron va en UTC).
    - cron: '7,37 6-21 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Enviar solo un mensaje de prueba a Telegram'
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_ENABLED: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_DAILY_BUDGET_EUR: '3'
      GEMINI_MODEL: gemini-3.5-flash-lite   # 500 peticiones/día en el nivel gratuito
      AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Faltan los secretos TELEGRAM_BOT_TOKEN y/o TELEGRAM_CHAT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Mensaje de prueba
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        run: |
          ok=0; fail=0
          IFS=',' read -ra ENTRIES <<< "$TELEGRAM_CHAT_ID"
          for entry in "${ENTRIES[@]}"; do
            id="${entry%%:*}"; id="${id// /}"
            [ -z "$id" ] && continue
            if curl -sS -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                 --data-urlencode "chat_id=${id}" \
                 --data-urlencode "text=✅ cero-radar conectado: recibirás aquí los avisos de chollos." > /dev/null; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); echo "No se pudo enviar a un destinatario (¿ha pulsado Iniciar en el bot?)"
            fi
          done
          echo "Mensajes de prueba enviados: $ok. Fallidos: $fail."
          [ "$ok" -gt 0 ]

      - uses: actions/setup-python@v5
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        with:
          python-version: '3.12'
          cache: pip

      - name: Restaurar base de datos
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        uses: actions/cache@v4
        with:
          path: |
            data
            config/market.local.json
            cero/static/cache
          key: cero-data-${{ github.run_id }}
          restore-keys: cero-data-

      - name: Instalar y configurar
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        run: |
          python -m pip install -r requirements.txt
          python configure.py --country ES

      - name: Arrancar el panel
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        run: |
          nohup python run.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/status > /dev/null; then echo "Panel listo"; exit 0; fi
            sleep 2
          done
          echo "El panel no arrancó"; tail -n 50 server.log; exit 1

      - name: Rastrear
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        run: python hunt.py --profile normal --wait

      - name: Resumen de buscadores
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        continue-on-error: true
        run: python -m cero.enginereport

      - name: Enviar avisos a Telegram
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        run: python -m cero.notify --send

      - name: Log del servidor si falla
        if: ${{ failure() }}
        run: tail -n 80 server.log || true
